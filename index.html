<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leben Care</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      line-height: 1.6;
    }

    /* Top Right About Link */
    .top-link {
      text-align: right;
      padding: 15px 30px;
      background: white;
    }

    .top-link a {
      color: #0d2a57;
      font-weight: bold;
      font-size: 20px;
      text-decoration: none;
    }

    /* White Section with Logo + About Text */
    .white-section {
      background: white;
      padding: 40px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: auto;
      gap: 40px;
    }

    .white-section img {
      height: 720px; /* Twice as big as before */
    }

    .about-text {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-weight: bold;
      font-size: 30px;
      color: #0d2a57;
      max-width: 500px;
      text-align: right;
    }

    /* Dark Blue Content Area */
    .content-area {
      background: #0d2a57;
      color: white;
      padding: 50px 20px;
    }

    section {
      max-width: 900px;
      margin: auto;
      margin-bottom: 40px;
    }

    h2 {
      color: #ffffff;
      margin-bottom: 10px;
    }

    h3 {
      color: #ffffff;
      margin-top: 25px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* Contact Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, textarea {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px;
      background: #ffffff;
      color: #0d2a57;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #dce6ff;
    }

    footer {
      background: #0d2a57;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #ffffffcc;
    }
  </style>
</head>

<body>

  <!-- Top Right About Link -->
  <div class="top-link">
    <a href="#about">About Leben Care</a>
  </div>

  <!-- White Section with Left Logo + Right Text -->
  <div class="white-section">
    <img src="logo.png" alt="Leben Care Logo" />

    <p class="about-text">
      At Leben Care we provide accessible, compassionate healthcare services including Telehealth 
      and in-office treatments. Our mission is to deliver high-quality care with flexibility, 
      transparency, and a patient-centered approach.
    </p>
  </div>
