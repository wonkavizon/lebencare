<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About – Leben Care</title>

  <style>
    body {
      margin: 0;
      padding-top: 120px;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      line-height: 1.6;
    }

    /* FIXED Banner */
    .banner {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0px;
      border-bottom: 2px solid #dcdcdc;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .banner-left img {
      height: 56px;
    }

    .logo-secondary {
      height: 112px;
    }

    .banner-right {
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
    }

    .banner-right a {
      color: #0d2a57;
      font-weight: bold;
      font-size: 20px;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .banner-right a:hover {
      color: #800000;
    }

    /* ABOUT PAGE CONTENT */
    .about-container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      line-height: 1.7;
      font-size: 18px;
    }

    h1 {
      font-family: "Times New Roman", Times, serif;
      font-size: 36px;
      font-weight: bold;
      text-align: left;
      margin-bottom: 30px;
      color: #0d2a57;
    }

    h2 {
      font-size: 28px;
      margin-top: 30px;
      color: #0d2a57;
      font-family: "Times New Roman", Times, serif;
      font-weight: bold;
    }

    p {
      margin-bottom: 18px;
    }

    /* TEAM PHOTO */
    .team-photo {
      float: left;
      width: 220px;
      margin: 0 20px 20px 0;
      border-radius: 6px;
    }

    /* FOOTER */
    footer {
      background: #0d2a57;
      color: #ffffffcc;
      padding: 40px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }
